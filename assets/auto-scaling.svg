<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 340" width="1100" height="340" role="img" aria-label="Auto scaling policy">
<rect width="1100" height="340" rx="20" fill="#232F3E"/>
<text x="40" y="44" font-family="'Segoe UI',Roboto,Arial,sans-serif" font-size="24" font-weight="800" fill="#fff" text-anchor="start" >CPU-Based Auto Scaling (design)</text><text x="40" y="68" font-family="'Segoe UI',Roboto,Arial,sans-serif" font-size="13.5" font-weight="400" fill="#9FB3CC" text-anchor="start" >Scale out above the CPU threshold, scale in when load falls, never below the minimum</text>
<g stroke="#3C5575"><path d="M60 80V220H1040" fill="none" stroke-width="2"/><path d="M60 110H1040M60 140H1040M60 170H1040" stroke-opacity="0.35"/></g>
<path d="M60 130H1040" stroke="#FF9900" stroke-width="2" stroke-dasharray="8 6"/><text x="1040" y="122" font-family="'Segoe UI',Roboto,Arial,sans-serif" font-size="12.5" font-weight="700" fill="#FF9900" text-anchor="end" >CPU threshold 50%</text>
<text x="52" y="224" font-family="'Segoe UI',Roboto,Arial,sans-serif" font-size="11" font-weight="500" fill="#7F95B3" text-anchor="end" >0%</text><text x="52" y="84" font-family="'Segoe UI',Roboto,Arial,sans-serif" font-size="11" font-weight="500" fill="#7F95B3" text-anchor="end" >100%</text><text x="550" y="240" font-family="'Segoe UI',Roboto,Arial,sans-serif" font-size="12" font-weight="500" fill="#7F95B3" text-anchor="middle" >time</text>
<polyline points="60,200 160,196 260,190 340,170 420,120 500,86 580,80 660,84 740,128 820,170 920,190 1040,196" fill="none" stroke="#2D8CFF" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1"><animate attributeName="stroke-dashoffset" values="1;0;0;1" keyTimes="0;0.55;0.92;1" dur="9s" repeatCount="indefinite"/></polyline>
<g font-family="'Segoe UI',Roboto,Arial,sans-serif" font-size="13" font-weight="700">
<g><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.38;0.45;0.92;1" dur="9s" repeatCount="indefinite"/>
<rect x="380" y="255" width="170" height="60" rx="12" fill="#10381f" stroke="#2ECC71" stroke-width="2" /><text x="465" y="282" font-family="'Segoe UI',Roboto,Arial,sans-serif" font-size="15" font-weight="800" fill="#fff" text-anchor="middle" >Scale-out  +1</text><text x="465" y="302" font-family="'Segoe UI',Roboto,Arial,sans-serif" font-size="11.5" font-weight="500" fill="#9be7b9" text-anchor="middle" >alarm: CPU &gt; 50%</text></g>
<g><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.7;0.76;0.95;1" dur="9s" repeatCount="indefinite"/>
<rect x="740" y="255" width="170" height="60" rx="12" fill="#3b2a10" stroke="#FF9900" stroke-width="2" /><text x="825" y="282" font-family="'Segoe UI',Roboto,Arial,sans-serif" font-size="15" font-weight="800" fill="#fff" text-anchor="middle" >Scale-in  -1</text><text x="825" y="302" font-family="'Segoe UI',Roboto,Arial,sans-serif" font-size="11.5" font-weight="500" fill="#FFD08A" text-anchor="middle" >CPU low, keep minimum</text></g></g>
<g><animate attributeName="opacity" values="1" dur="1s"/><text x="100" y="290" font-family="'Segoe UI',Roboto,Arial,sans-serif" font-size="13" font-weight="600" fill="#B7C6DB" text-anchor="start" >min / desired / max capacity</text></g>
</svg>