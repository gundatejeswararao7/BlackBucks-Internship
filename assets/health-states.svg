<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 260" width="1100" height="260" role="img" aria-label="Target health states">
<rect width="1100" height="260" rx="20" fill="#232F3E"/>
<text x="40" y="44" font-family="'Segoe UI',Roboto,Arial,sans-serif" font-size="24" font-weight="800" fill="#fff" text-anchor="start" >Target Health States</text><text x="40" y="68" font-family="'Segoe UI',Roboto,Arial,sans-serif" font-size="13.5" font-weight="400" fill="#9FB3CC" text-anchor="start" >What the Target Group showed in the recording</text>
<rect x="60" y="105" width="230" height="110" rx="14" fill="#2b3441" stroke="#8896A8" stroke-width="2" /><circle cx="110" cy="160" r="20" fill="none" stroke="#B9C3D1" stroke-width="3"/><path d="M110 148v13l9 6" stroke="#B9C3D1" stroke-width="3" fill="none" stroke-linecap="round"><animateTransform attributeName="transform" type="rotate" values="0 110 160;360 110 160" dur="6s" repeatCount="indefinite"/></path>
<text x="205" y="155" font-family="'Segoe UI',Roboto,Arial,sans-serif" font-size="24" font-weight="800" fill="#fff" text-anchor="middle" >Initial</text><text x="205" y="180" font-family="'Segoe UI',Roboto,Arial,sans-serif" font-size="12" font-weight="400" fill="#B7C6DB" text-anchor="middle" >checks running</text><text x="205" y="198" font-family="'Segoe UI',Roboto,Arial,sans-serif" font-size="12" font-weight="500" fill="#8FA0B6" text-anchor="middle" >2 of 2 at start</text>
<rect x="435" y="105" width="230" height="110" rx="14" fill="#10381f" stroke="#2ECC71" stroke-width="2" /><circle cx="485" cy="160" r="20" fill="#2ECC71"><animate attributeName="r" values="20;24;20" dur="1.6s" repeatCount="indefinite"/></circle><path d="M476 160l7 8l13-15" stroke="#232F3E" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<text x="580" y="155" font-family="'Segoe UI',Roboto,Arial,sans-serif" font-size="24" font-weight="800" fill="#fff" text-anchor="middle" >Healthy</text><text x="580" y="180" font-family="'Segoe UI',Roboto,Arial,sans-serif" font-size="12" font-weight="400" fill="#9be7b9" text-anchor="middle" >receives traffic</text><text x="580" y="198" font-family="'Segoe UI',Roboto,Arial,sans-serif" font-size="12" font-weight="500" fill="#8FD3AA" text-anchor="middle" >2 of 2 after warm-up</text>
<rect x="810" y="105" width="230" height="110" rx="14" fill="#3b1a1f" stroke="#FF5A5F" stroke-width="2" /><circle cx="860" cy="160" r="20" fill="#FF5A5F"/><path d="M851 151l18 18M869 151l-18 18" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
<text x="955" y="155" font-family="'Segoe UI',Roboto,Arial,sans-serif" font-size="24" font-weight="800" fill="#fff" text-anchor="middle" >Unhealthy</text><text x="955" y="180" font-family="'Segoe UI',Roboto,Arial,sans-serif" font-size="12" font-weight="400" fill="#FFB3B6" text-anchor="middle" >out of rotation</text><text x="955" y="198" font-family="'Segoe UI',Roboto,Arial,sans-serif" font-size="12" font-weight="500" fill="#FF9CA0" text-anchor="middle" >ASG replaces it</text>
<g stroke="#9FB3CC" stroke-width="3" fill="none" stroke-linecap="round"><path d="M296 160h130"><animate attributeName="stroke-dasharray" values="0 130;130 0" dur="1.8s" repeatCount="indefinite"/></path><path d="M671 160h130" stroke-dasharray="6 8"><animate attributeName="stroke-dashoffset" values="0;-28" dur="1.4s" repeatCount="indefinite"/></path></g>
<text x="361" y="148" font-family="'Segoe UI',Roboto,Arial,sans-serif" font-size="11.5" font-weight="500" fill="#9FB3CC" text-anchor="middle" >checks pass</text><text x="736" y="148" font-family="'Segoe UI',Roboto,Arial,sans-serif" font-size="11.5" font-weight="500" fill="#9FB3CC" text-anchor="middle" >checks fail</text>
</svg>